# This file is the committed default template.
# Put machine-specific overrides in bridge/config/wingpu.local.toml
# or ~/.config/wingpu/wingpu.local.toml.

[paths]
remote_home = "/home/your-wsl-user"
remote_src_root = "{remote_home}/src"
remote_models_root = "{remote_home}/models/Qwen"

[connection]
host = "gpu-host"
distro = "Ubuntu"
api_key = "local-dev-key"
local_port = 8000
remote_port = 8000
ssh_connect_timeout = 8
server_alive_interval = 30
server_alive_count_max = 3

[gateway]
listen_host = "127.0.0.1"
backend_host = "127.0.0.1"
backend_local_port = 18000
backend_tunnel_target_host = "auto"
idle_offload_enabled = true
idle_timeout_seconds = 1800
idle_poll_seconds = 5
request_timeout_seconds = 1800
client_read_timeout_seconds = 60
restart_mode = "on_demand"

[runtime_defaults]
default_runtime = "upstream-mtp"
served_model_name = "qwen-local"
n_gpu_layers = 99
threads = 8
startup_timeout_seconds = 240
build_jobs = 8
cuda_architectures = "89"
flash_attn = true
remote_state_dir = "~/.gpu-bridge"
default_cache_type_k = "q4_0"
default_cache_type_v = "q4_0"
cmake_args = [
  "-DGGML_CUDA=ON",
  "-DGGML_NATIVE=OFF",
  "-DGGML_CUDA_FA_ALL_QUANTS=ON",
]
build_targets = ["llama-server", "llama-bench"]
extra_server_args = []

[runtimes.upstream]
kind = "native"
source_dir = "{remote_src_root}/llama.cpp"
build_dir = "{remote_src_root}/llama.cpp/build-cuda89"
server_bin = "{remote_src_root}/llama.cpp/build-cuda89/bin/llama-server"
bench_bin = "{remote_src_root}/llama.cpp/build-cuda89/bin/llama-bench"
default_branch = "master"
supported_cache_types = ["f16", "bf16", "q8_0", "q4_0", "q4_1"]
extra_server_args = []
notes = "Upstream llama.cpp CUDA baseline, no speculative decoding. Slower to decode than upstream-mtp but needs ~1.0 GiB less VRAM, so it is the lane to use for the longest contexts (see Qwen3.8-27B-UD-IQ2_M at 262144)."

[runtimes."upstream-mtp"]
kind = "native"
source_dir = "{remote_src_root}/llama.cpp"
build_dir = "{remote_src_root}/llama.cpp/build-cuda89"
server_bin = "{remote_src_root}/llama.cpp/build-cuda89/bin/llama-server"
bench_bin = "{remote_src_root}/llama.cpp/build-cuda89/bin/llama-bench"
default_branch = "master"
supported_cache_types = ["f16", "bf16", "q8_0", "q4_0", "q4_1"]
extra_server_args = ["--spec-type", "draft-mtp", "--spec-draft-n-max", "3"]
notes = """Default lane. MTP speculative decoding against the MTP head embedded in the Unsloth \
Qwen3.8-27B GGUFs (blk.64.nextn.*, nextn_predict_layers = 1), so no separate MTP model file is \
needed the way Qwen3.6 required one. llama.cpp loads those tensors only when --spec-type \
draft-mtp is set, so the plain upstream lane pays no VRAM for them. Measured 2026-08-17 on \
Qwen3.8-27B-UD-Q3_K_XL at 65536 ctx with q4_0 K/V, greedy decode: 66.3 tok/s versus 38.1 tok/s \
on the upstream lane (+74%), for about 1.0 GiB of extra VRAM. --spec-draft-n-max 2 / 3 / 4 \
measured 64.7 / 66.3 / 67.0 tok/s with 67% / 56% / 47% draft acceptance; that spread is inside \
the run-to-run noise (repeat n=3 runs gave 62.4-66.3), so 3 is chosen as a middle value that \
still reproduces n=2's greedy output byte for byte, while n=4 diverges and costs 150 MiB more. \
Speculative verification batches tokens differently from plain decode, so greedy output is not \
bit-identical to the upstream lane; it is deterministic within a lane. llama.cpp issue #27122 \
reports MTP lockups with Qwen3.8, but only under --split-mode tensor on multi-GPU hosts; this \
single-GPU host uses the default layer split and was stable across every probe."""

[broker]
# Shared GPU lease arbiter on the WSL host (wsl/gpu_broker.py). It ensures only one
# bridge (wingpu/llama, locatectl, ocrctl, minerctl) holds the GPU at a time: wingpu
# evicts the current holder and waits for VRAM to drain before loading llama, then
# releases the lease on idle-offload/stop. Set enabled=false to disable entirely.
enabled = true
runtime_id = "llama"
# remote_dir: where gpu_broker.py + broker.db live on WSL. Empty = runtime_defaults.remote_state_dir.
remote_dir = ""
vram_floor_mb = 2000
free_timeout_seconds = 60
acquire_wait_seconds = 30
busy_util_pct = 15
# watchdog_idle_timeout_seconds must stay >= gateway.idle_timeout_seconds. The watchdog
# is a backstop for a bridge that stopped reporting; the gateway's own idle offload has
# to fire first, because only it releases the GPU lease and updates gateway state. The
# watchdog is off by default, so this only matters once it is started explicitly.
watchdog_idle_timeout_seconds = 2100
watchdog_poll_seconds = 15

[state]
state_dir = "~/.gpu-chat-bridge"
selected_model_file = "selected_model"
selected_runtime_file = "selected_runtime"
selected_cache_type_k_file = "selected_cache_type_k"
selected_cache_type_v_file = "selected_cache_type_v"
benchmark_dir_name = "benchmarks"
restart_on_model_set = false
gateway_pid_file = "gateway.pid"
gateway_log_file = "gateway.log"
gateway_state_file = "gateway_state.json"
gateway_lock_file = "gateway.lock"
