[project]
name = "gpubroker"
version = "1.0.0"
description = "Shared GPU lease broker, client, and SSH relay helpers for the wingpu bridges"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gpu-broker = "gpubroker.broker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubroker"]

[tool.uv]
package = true
